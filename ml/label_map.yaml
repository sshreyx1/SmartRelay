# ESC-50 category -> label name in common/sound_classes.py (docs/SENSORS.md).
# Animal categories get their own label; HUMAN / VEHICLE / WEATHER categories map to the group only.
# AMBIENT has no ESC-50 category: it is recorded on the device (record_dataset.py --ambient).
categories:
  # BIRD
  rooster: ROOSTER
  hen: HEN
  crow: CROW
  chirping_birds: SONGBIRD
  # MAMMAL
  dog: DOG
  cat: CAT
  cow: COW
  pig: PIG
  sheep: SHEEP
  # INSECT_FROG
  frog: FROG
  crickets: CRICKET
  insects: INSECT_BUZZ
  # HUMAN (group only)
  footsteps: HUMAN
  laughing: HUMAN
  coughing: HUMAN
  clapping: HUMAN
  # VEHICLE (group only)
  car_horn: VEHICLE
  engine: VEHICLE
  airplane: VEHICLE
  chainsaw: VEHICLE
  # WEATHER (group only)
  rain: WEATHER
  wind: WEATHER
  thunderstorm: WEATHER
  sea_waves: WEATHER
